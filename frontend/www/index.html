<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- 嚴格內容安全政策（正式上線時可將 connect-src 中的 https: 進一步鎖定為您的正式 API 網域） -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:3000 http://127.0.0.1:3000; object-src 'none'; base-uri 'self'; form-action 'self';"
  />
  <meta name="description" content="溫潤樸素的家庭與毛孩體重紀錄日誌（Kin &amp; Paws Weight），支援家人、貓咪與狗狗體重趨勢、健康指標、隱私密碼鎖與雲端同步。" />
  <meta name="theme-color" content="#F6F4EE" />
  <meta name="apple-mobile-web-app-title" content="家與毛孩體重誌" />
  <title>家與毛孩體重誌 · Kin &amp; Paws Weight</title>
  <link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./vendor/chart.umd.min.js" defer></script>
  <script src="./config.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body class="bg-paper text-ink">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-20 bg-paper/90 backdrop-blur border-b border-oat-200 px-4 py-3 flex justify-between items-center gap-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <img
        src="./icons/app-icon.svg"
        alt="家與毛孩體重誌圖示"
        class="w-10 h-10 rounded-xl border border-oat-200 shadow-sm shrink-0"
      />
      <div class="min-w-0">
        <div class="flex items-baseline gap-1.5 min-w-0">
          <h1 class="text-base font-semibold tracking-wider text-ink truncate">家與毛孩體重誌</h1>
          <span class="hidden sm:inline text-[13px] font-medium tracking-wide text-sage-700/80 shrink-0">Kin &amp; Paws Weight</span>
        </div>
        <p id="header-family-code" class="text-fluid-label text-ink-400 font-mono truncate">同步碼：載入中...</p>
      </div>
    </div>
    <button id="btn-refresh" type="button" class="inline-flex items-center gap-1.5 text-xs bg-linen hover:bg-oat-100 text-ink-700 border border-oat-200 px-3 py-1.5 rounded-full font-medium shrink-0 whitespace-nowrap">
      <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8 8 0 0 0-14.5-4.6L3 9" />
        <path d="M3 4v5h5" />
        <path d="M4 13a8 8 0 0 0 14.5 4.6L21 15" />
        <path d="M21 20v-5h-5" />
      </svg>
      <span>同步</span>
    </button>
  </header>

  <!-- 狀態提示條 (Toast) -->
  <div id="toast" class="toast-banner hidden fixed top-16 left-1/2 z-50 max-w-[calc(100vw-2rem)] text-center px-4 py-2 rounded-full text-xs font-medium text-linen shadow-soft"></div>

  <!-- 手機左／右邊緣滑動返回指示器 -->
  <div id="swipe-back-indicator" class="swipe-back-indicator" aria-hidden="true"></div>

  <!-- 主內容區 -->
  <main class="page-stage max-w-lg mx-auto p-4">

    <!-- 分頁 1：總覽 -->
    <section id="view-overview" class="page-view pb-20">
      <div id="overview-pull-refresh" class="pull-refresh-slot" aria-live="polite"></div>
      <div id="member-cards" class="space-y-3"></div>
    </section>

    <!-- 分頁 2：統計（摘要統計 + 趨勢圖表 + 歷史紀錄） -->
    <section id="view-charts" class="page-view hidden space-y-4">
      <!-- 成員切換 -->
      <div id="chart-member-pills" class="flex gap-2 overflow-x-auto pb-1"></div>

      <!-- 日/週/月/年 切換按鈕 -->
      <div id="chart-range-pills" class="flex bg-oat-100 border border-oat-200 p-1 rounded-2xl text-xs font-medium">
        <button type="button" data-range="day" class="range-btn flex-1 py-1.5 rounded-xl bg-linen text-sage-700 shadow-sm">日</button>
        <button type="button" data-range="week" class="range-btn flex-1 py-1.5 rounded-xl text-ink-500">週</button>
        <button type="button" data-range="month" class="range-btn flex-1 py-1.5 rounded-xl text-ink-500">月</button>
        <button type="button" data-range="year" class="range-btn flex-1 py-1.5 rounded-xl text-ink-500">年</button>
      </div>

      <!-- 區間統計摘要、目標進度與提醒 -->
      <div id="chart-stats-summary" class="space-y-3"></div>

      <div class="journal-card p-4 rounded-2xl space-y-2.5">
        <div id="chart-inspect-bar" class="min-h-[34px] rounded-xl px-3 py-1.5 flex items-center justify-between gap-2 text-fluid-label bg-oat-50 border border-oat-200/70 text-ink-400"></div>
        <div class="select-none">
          <canvas id="weightChart" height="220" class="touch-pan-y select-none"></canvas>
        </div>
      </div>
      <div class="journal-card p-4 rounded-2xl">
        <div class="flex items-center justify-between gap-2 mb-3">
          <h3 class="font-semibold text-sm text-ink-700 tracking-wide">歷史紀錄</h3>
          <span id="history-count" class="text-fluid-label text-ink-400 tabular-nums shrink-0 whitespace-nowrap"></span>
        </div>
        <ul id="history-list" class="divide-y divide-oat-100 text-sm"></ul>
        <div id="history-pagination" class="hidden pt-3 mt-2 border-t border-oat-100 grid grid-cols-[1fr_auto_1fr] items-center gap-1.5 text-xs"></div>
      </div>
    </section>

    <!-- 分頁 3：設定與成員管理 -->
    <section id="view-settings" class="page-view hidden space-y-4">
      <div class="journal-card p-4 rounded-2xl space-y-3.5">
        <h2 class="font-semibold text-ink text-sm tracking-wide flex items-center gap-2">
          <svg class="w-4 h-4 text-sage-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6.5 18h11a4 4 0 0 0 .8-7.92A5.5 5.5 0 0 0 7.6 8.3 3.8 3.8 0 0 0 6.5 18Z" />
          </svg>
          <span>雲端同步設定</span>
        </h2>
        <div>
          <label class="text-xs text-ink-500">家庭同步碼（12-64 字元英數字、- 或 _，輸入相同代碼即可同步）</label>
          <div class="flex gap-2 mt-1.5">
            <input id="input-family-code" type="text" maxlength="64" autocomplete="off" class="min-w-0 flex-1 border rounded-xl p-2.5 text-sm font-mono" />
            <button id="btn-generate-code" type="button" class="shrink-0 whitespace-nowrap inline-flex items-center gap-1.5 text-xs bg-oat-100 hover:bg-oat-200 text-ink-700 border border-oat-200 px-3 py-2 rounded-xl font-medium">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z" />
              </svg>
              <span>產生</span>
            </button>
          </div>
        </div>
        <div id="api-key-setting-wrap" class="hidden">
          <label class="text-xs text-ink-500">API 金鑰（若未透過 config.js 注入，請在此填入）</label>
          <input id="input-api-key" type="password" autocomplete="off" placeholder="請輸入與後端 APP_API_KEY 相符的金鑰" class="w-full border rounded-xl p-2.5 text-sm mt-1.5" />
        </div>
        <button id="btn-save-settings" type="button" class="w-full py-2.5 bg-ink text-linen rounded-xl text-sm font-medium tracking-wide">儲存並重新同步</button>
      </div>

      <div class="journal-card p-4 rounded-2xl space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-semibold text-ink text-sm tracking-wide flex items-center gap-2">
            <svg class="w-4 h-4 text-sage-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="8.5" r="3" />
              <path d="M3.5 18.5c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" />
              <circle cx="16.5" cy="9.5" r="2.2" />
              <path d="M16.5 14.5c1.8 0 3.4 1 4 3.2" />
            </svg>
            <span>成員管理</span>
          </h2>
          <button id="btn-open-member-modal" type="button" class="inline-flex items-center gap-1 text-xs bg-sage-600 text-linen px-3 py-1.5 rounded-xl font-medium">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span>新增成員</span>
          </button>
        </div>
        <ul id="settings-member-list" class="divide-y divide-oat-100 text-sm"></ul>
      </div>
    </section>
  </main>

  <!-- 總覽頁固定底部操作列（位於導覽列正上方，切換分頁時柔和淡出） -->
  <div id="overview-record-dock" class="overview-record-dock fixed inset-x-0 z-20 pointer-events-none">
    <div class="max-w-lg mx-auto px-4 pt-5 pb-3 flex justify-center">
      <button id="btn-open-record-modal" type="button" class="pointer-events-auto w-2/3 min-w-[11.5rem] py-3.5 bg-sage-600 hover:bg-sage-700 text-linen font-medium tracking-wide rounded-2xl shadow-soft flex items-center justify-center gap-2 text-sm whitespace-nowrap">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>記錄今日體重</span>
      </button>
    </div>
  </div>

  <!-- 底部導覽列（精簡 3 分頁，細線文青圖示） -->
  <nav class="fixed bottom-0 inset-x-0 h-16 bg-linen/95 backdrop-blur border-t border-oat-200 flex items-center justify-around text-[13px] text-ink-400 z-30">
    <button type="button" data-tab="overview" class="nav-btn tab-active flex flex-col items-center gap-0.5">
      <span class="nav-icon-wrap w-9 h-6 rounded-full flex items-center justify-center transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11.2L12 4.5l8 6.7" />
          <path d="M6.5 10.5V19h11v-8.5" />
          <path d="M10 19v-4.5h4V19" />
        </svg>
      </span>
      <span>總覽</span>
    </button>
    <button type="button" data-tab="charts" class="nav-btn flex flex-col items-center gap-0.5">
      <span class="nav-icon-wrap w-9 h-6 rounded-full flex items-center justify-center transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19h16" />
          <path d="M5.5 14.5l4-4 3.2 2.5L18.5 7" />
          <path d="M15 7h3.5v3.5" />
        </svg>
      </span>
      <span>統計</span>
    </button>
    <button type="button" data-tab="settings" class="nav-btn flex flex-col items-center gap-0.5">
      <span class="nav-icon-wrap w-9 h-6 rounded-full flex items-center justify-center transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2" />
          <circle cx="16" cy="7" r="2" />
          <path d="M4 12h4M12 12h8" />
          <circle cx="10" cy="12" r="2" />
          <path d="M4 17h11M19 17h1" />
          <circle cx="17" cy="17" r="2" />
        </svg>
      </span>
      <span>設定</span>
    </button>
  </nav>

  <!-- 彈窗：新增體重紀錄（支援批量紀錄與單筆詳細紀錄切換） -->
  <div id="modal-record" class="modal-overlay hidden fixed inset-0 bg-ink/35 backdrop-blur-[2px] z-50 flex items-end sm:items-center justify-center p-4">
    <form id="form-record" novalidate class="modal-sheet bg-linen border border-oat-200 w-full max-w-md rounded-3xl p-5 space-y-4 shadow-soft">
      <div class="flex justify-between items-center">
        <h3 class="font-semibold text-base text-ink tracking-wide">記錄體重</h3>
        <div class="flex bg-oat-100 border border-oat-200 p-1 rounded-xl text-xs font-medium">
          <button type="button" id="btn-rec-mode-batch" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-linen text-sage-700 shadow-sm">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4L4 8.5 12 13l8-4.5L12 4Z" />
              <path d="M4 13l8 4.5 8-4.5" />
            </svg>
            <span>批量</span>
          </button>
          <button type="button" id="btn-rec-mode-single" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-ink-500">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.8 5.2a2.1 2.1 0 0 1 3 3L8.5 18.5 4.5 19.5l1-4 10.3-10.3Z" />
            </svg>
            <span>單筆</span>
          </button>
        </div>
      </div>

      <!-- 批量模式：一次填寫多位成員今日體重 -->
      <div id="rec-batch-fields" class="space-y-3">
        <div>
          <label class="text-xs text-ink-500">紀錄日期（未填體重的成員會自動略過）</label>
          <input id="batch-date" type="date" min="2000-01-01" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
        </div>
        <div id="batch-member-rows" class="max-h-64 overflow-y-auto divide-y divide-oat-100 border border-oat-200 bg-paper/60 rounded-2xl px-3"></div>
      </div>

      <!-- 單筆模式：針對單一成員記錄體重與備註 -->
      <div id="rec-single-fields" class="hidden space-y-3">
        <select id="rec-member" class="w-full border rounded-xl p-2.5 text-sm"></select>
        <div class="relative">
          <input id="rec-weight" type="text" inputmode="decimal" autocomplete="off" placeholder="體重 (kg)，例：62.5 或 4.35" class="w-full border rounded-xl p-2.5 text-sm tabular-nums" />
          <button id="btn-rec-weight-visibility" type="button" class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-ink-400 hover:text-ink-700 hover:bg-oat-100" aria-label="顯示輸入體重" title="暫時顯示輸入內容"></button>
        </div>
        <input id="rec-date" type="date" min="2000-01-01" class="w-full border rounded-xl p-2.5 text-sm" />
        <input id="rec-note" type="text" maxlength="200" placeholder="備註（選填，例：飯後、換飼料、散步後）" class="w-full border rounded-xl p-2.5 text-sm" />
      </div>

      <div class="flex gap-2">
        <button type="button" class="btn-close-modal flex-1 py-2.5 bg-oat-100 text-ink-700 rounded-xl text-sm font-medium">取消</button>
        <button id="btn-rec-submit" type="submit" class="flex-1 py-2.5 bg-sage-600 text-linen rounded-xl text-sm font-medium">儲存</button>
      </div>
    </form>
  </div>

  <!-- 彈窗：新增 / 編輯成員（含 12 款文青頭像自由選擇） -->
  <div id="modal-member" class="modal-overlay hidden fixed inset-0 bg-ink/35 backdrop-blur-[2px] z-50 flex items-end sm:items-center justify-center p-4">
    <form id="form-member" class="modal-sheet bg-linen border border-oat-200 w-full max-w-md max-h-[90vh] overflow-y-auto rounded-3xl p-5 space-y-4 shadow-soft">
      <h3 id="mem-modal-title" class="font-semibold text-base text-ink tracking-wide">新增成員</h3>
      <input type="hidden" id="mem-id" />
      <input type="hidden" id="mem-avatar" />
      <div>
        <label class="text-xs text-ink-500">成員名稱</label>
        <input id="mem-name" type="text" maxlength="50" required placeholder="名稱（例：爸爸、橘貓咪咪、柴犬豆豆）" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
      </div>
      <div>
        <label class="text-xs text-ink-500">成員類型</label>
        <select id="mem-type" class="w-full border rounded-xl p-2.5 text-sm mt-1">
          <option value="human">家人</option>
          <option value="cat">貓咪</option>
          <option value="dog">狗狗</option>
        </select>
      </div>
      <div>
        <div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-0.5">
          <label class="text-xs text-ink-500">選擇頭像</label>
          <span class="text-fluid-label text-ink-400">可自由挑選喜愛的插畫頭像</span>
        </div>
        <div id="mem-avatar-picker" class="grid grid-cols-4 gap-1.5 mt-1.5"></div>
      </div>
      <div id="mem-breed-wrap" class="hidden">
        <label class="text-xs text-ink-500">品種（選填）</label>
        <input id="mem-breed" type="text" maxlength="40" placeholder="例：橘貓、米克斯、柴犬、貴賓" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
      </div>
      <div id="mem-birth-date-wrap">
        <label class="text-xs text-ink-500">生日（選填，自動計算年齡）</label>
        <input id="mem-birth-date" type="date" min="1900-01-01" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
      </div>
      <div id="mem-height-wrap">
        <label class="text-xs text-ink-500">身高 (cm)</label>
        <input id="mem-height" type="number" min="20" max="300" step="0.1" placeholder="家人計算 BMI 用，毛孩可留空" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
      </div>
      <div id="mem-bcs-wrap" class="hidden">
        <label class="text-xs text-ink-500">體態評分 BCS（1–9 分，選填）</label>
        <select id="mem-bcs" class="w-full border rounded-xl p-2.5 text-sm mt-1">
          <option value="">未評分（總覽顯示一週體重變化）</option>
          <option value="1">1 分 · 極瘦（肋骨腰椎極明顯）</option>
          <option value="2">2 分 · 過瘦（幾乎無脂肪覆蓋）</option>
          <option value="3">3 分 · 偏瘦（肋骨易見、腰身明顯凹陷）</option>
          <option value="4">4 分 · 適中偏瘦（輕摸可感肋骨）</option>
          <option value="5">5 分 · 理想體態（肋骨好摸、腰身自然）</option>
          <option value="6">6 分 · 略重（肋骨需稍用力才摸到）</option>
          <option value="7">7 分 · 過重（肋骨難摸、腰身不明顯）</option>
          <option value="8">8 分 · 肥胖（摸不到肋骨、腹部下垂）</option>
          <option value="9">9 分 · 重度肥胖（明顯脂肪堆積）</option>
        </select>
      </div>
      <div id="mem-target-wrap">
        <label class="text-xs text-ink-500">目標體重 (kg)</label>
        <input id="mem-target" type="text" inputmode="decimal" autocomplete="off" placeholder="選填" class="w-full border rounded-xl p-2.5 text-sm mt-1 tabular-nums" />
      </div>

      <!-- 隱私保護設定（可選配個人 4 位數 PIN 密碼） -->
      <div class="bg-oat-50 border border-oat-200 rounded-2xl p-3.5 space-y-2.5">
        <div id="mem-privacy-locked-box" class="hidden flex flex-wrap items-center justify-between gap-2 text-xs text-ink-500">
          <span class="min-w-0 flex-1 leading-snug">已啟用密碼保護，解鎖後可修改目標體重與隱私設定</span>
          <button type="button" id="btn-mem-unlock" class="shrink-0 whitespace-nowrap bg-linen border border-oat-200 text-sage-700 px-2.5 py-1 rounded-lg font-medium">解鎖編輯</button>
        </div>
        <div id="mem-privacy-controls" class="space-y-2.5">
          <label class="flex items-start gap-2.5 cursor-pointer select-none">
            <input id="mem-hide-weight" type="checkbox" class="mt-0.5 rounded border-oat-300 accent-sage-600" />
            <span class="text-xs leading-relaxed">
              <span class="font-medium text-ink block">隱藏真實體重（隱私模式）</span>
              <span class="text-ink-400">遮蔽公斤數與精確 BMI，只顯示變化趨勢與達標進度</span>
            </span>
          </label>
          <div id="mem-pin-wrap" class="hidden space-y-2 pt-1 border-t border-oat-200/80">
            <div>
              <label id="mem-pin-label" for="mem-pin" class="text-xs text-ink-500">個人 4 位數密碼（選填，建議共用同步碼時設定）</label>
              <input id="mem-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="留空表示不設密碼，或輸入 4 位數字" class="w-full border rounded-xl p-2 text-sm font-mono tracking-widest mt-1" />
            </div>
            <label id="mem-clear-pin-wrap" class="hidden flex items-center gap-2 text-xs text-ink-500 cursor-pointer select-none">
              <input id="mem-clear-pin" type="checkbox" class="rounded border-oat-300" />
              <span>清除現有密碼（改為無密碼點擊暫時檢視）</span>
            </label>
          </div>
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button type="button" class="btn-close-modal flex-1 py-2.5 bg-oat-100 text-ink-700 rounded-xl text-sm font-medium">取消</button>
        <button id="btn-mem-submit" type="submit" class="flex-1 py-2.5 bg-sage-600 text-linen rounded-xl text-sm font-medium">新增</button>
      </div>
    </form>
  </div>

  <!-- 彈窗：個人資訊與編輯（內建自動健康指標、頭像更換與隱私鎖） -->
  <div id="modal-profile" class="modal-overlay hidden fixed inset-0 bg-ink/35 backdrop-blur-[2px] z-50 flex items-end sm:items-center justify-center p-4">
    <form id="form-profile" class="modal-sheet bg-linen border border-oat-200 w-full max-w-md max-h-[90vh] overflow-y-auto rounded-3xl p-5 space-y-4 shadow-soft">
      <div class="flex justify-between items-center gap-2 border-b border-oat-200 pb-3">
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
          <button type="button" id="prof-avatar-slot" title="點擊更換頭像" aria-label="點擊更換頭像" class="shrink-0 relative rounded-full focus:outline-none focus:ring-2 focus:ring-sage-500/40"></button>
          <div class="min-w-0">
            <h3 id="prof-title" class="font-semibold text-base text-ink leading-snug break-words">個人資訊</h3>
            <p id="prof-subtitle" class="text-fluid-label text-ink-400">成員檔案</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" id="btn-prof-privacy-toggle" class="hidden inline-flex items-center gap-1 whitespace-nowrap text-xs bg-oat-100 text-ink-700 border border-oat-200 px-2.5 py-1.5 rounded-xl font-medium"></button>
          <button type="button" id="btn-prof-to-chart" class="inline-flex items-center gap-1 whitespace-nowrap text-xs bg-sage-50 text-sage-700 border border-sage-200 px-2.5 py-1.5 rounded-xl font-medium">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19h16" />
              <path d="M5.5 14.5l4-4 3.2 2.5L18.5 7" />
            </svg>
            <span>統計</span>
          </button>
        </div>
      </div>

      <!-- 點擊頭像快速更換抽屜 -->
      <div id="prof-inline-avatar-drawer" class="hidden bg-oat-50 border border-oat-200 rounded-2xl p-3 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <span class="text-xs font-medium text-ink-700">點擊頭像立即更換</span>
          <button type="button" id="btn-prof-close-avatar-drawer" class="text-xs text-ink-400 hover:text-ink-700 px-1.5 py-0.5 rounded-lg">關閉</button>
        </div>
        <div id="prof-inline-avatar-picker" class="grid grid-cols-4 gap-1.5"></div>
      </div>

      <div id="prof-summary" class="grid grid-cols-2 gap-2 bg-oat-50 border border-oat-200/70 p-3 rounded-2xl text-center text-sm"></div>

      <button type="button" id="btn-prof-add-record" class="w-full py-2.5 bg-sage-50 hover:bg-sage-100 text-sage-700 font-medium rounded-xl text-sm border border-sage-200 inline-flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>為此成員新增體重</span>
      </button>

      <input type="hidden" id="prof-id" />
      <input type="hidden" id="prof-avatar" />

      <!-- 檢視模式：點擊任一可編輯欄位即可原地修改 -->
      <div id="prof-view-fields" class="divide-y divide-oat-100 text-sm border border-oat-200 bg-paper/50 rounded-2xl px-1.5 py-0.5"></div>

      <!-- 檢視模式：自動健康指標卡（家人顯示 BMI 判定與健康體重區間；貓狗顯示 RER / DER 熱量與 BCS 指南） -->
      <div id="prof-health-card" class="hidden rounded-2xl p-3.5 text-sm space-y-2 border"></div>

      <!-- 編輯模式：點擊編輯後才顯示輸入框與頭像選擇器 -->
      <div id="prof-edit-fields" class="hidden space-y-3">
        <div>
          <label class="text-xs text-ink-500">成員名稱</label>
          <input id="prof-name" type="text" maxlength="50" required placeholder="例：爸爸、橘貓咪咪、柴犬豆豆" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
        </div>

        <div>
          <label class="text-xs text-ink-500">選擇頭像</label>
          <div id="prof-avatar-picker" class="grid grid-cols-4 gap-1.5 mt-1.5"></div>
        </div>

        <div id="prof-breed-wrap" class="hidden">
          <label class="text-xs text-ink-500">品種（選填）</label>
          <input id="prof-breed" type="text" maxlength="40" placeholder="例：橘貓、米克斯、柴犬、貴賓" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
        </div>

        <div id="prof-birth-date-wrap">
          <label class="text-xs text-ink-500">生日（選填，自動計算年齡）</label>
          <input id="prof-birth-date" type="date" min="1900-01-01" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
        </div>

        <div id="prof-height-wrap">
          <label class="text-xs text-ink-500">身高 (cm)</label>
          <input id="prof-height" type="number" min="20" max="300" step="0.1" placeholder="例：172.5" class="w-full border rounded-xl p-2.5 text-sm mt-1" />
        </div>

        <div id="prof-bcs-wrap" class="hidden">
          <label class="text-xs text-ink-500">體態評分 BCS（1–9 分，選填）</label>
          <select id="prof-bcs" class="w-full border rounded-xl p-2.5 text-sm mt-1">
            <option value="">未評分（總覽顯示一週體重變化）</option>
            <option value="1">1 分 · 極瘦（肋骨腰椎極明顯）</option>
            <option value="2">2 分 · 過瘦（幾乎無脂肪覆蓋）</option>
            <option value="3">3 分 · 偏瘦（肋骨易見、腰身明顯凹陷）</option>
            <option value="4">4 分 · 適中偏瘦（輕摸可感肋骨）</option>
            <option value="5">5 分 · 理想體態（肋骨好摸、腰身自然）</option>
            <option value="6">6 分 · 略重（肋骨需稍用力才摸到）</option>
            <option value="7">7 分 · 過重（肋骨難摸、腰身不明顯）</option>
            <option value="8">8 分 · 肥胖（摸不到肋骨、腹部下垂）</option>
            <option value="9">9 分 · 重度肥胖（明顯脂肪堆積）</option>
          </select>
        </div>

        <div id="prof-target-wrap">
          <label class="text-xs text-ink-500">目標體重 (kg)</label>
          <input id="prof-target" type="text" inputmode="decimal" autocomplete="off" placeholder="例：65.0" class="w-full border rounded-xl p-2.5 text-sm mt-1 tabular-nums" />
        </div>

        <!-- 編輯模式：隱私保護設定 -->
        <div class="bg-oat-50 border border-oat-200 rounded-2xl p-3.5 space-y-2.5">
          <div id="prof-privacy-locked-box" class="hidden flex flex-wrap items-center justify-between gap-2 text-xs text-ink-500">
            <span class="min-w-0 flex-1 leading-snug">已啟用密碼保護，解鎖後可修改目標體重與隱私設定</span>
            <button type="button" id="btn-prof-unlock-edit" class="shrink-0 whitespace-nowrap bg-linen border border-oat-200 text-sage-700 px-2.5 py-1 rounded-lg font-medium">解鎖編輯</button>
          </div>
          <div id="prof-privacy-controls" class="space-y-2.5">
            <label class="flex items-start gap-2.5 cursor-pointer select-none">
              <input id="prof-hide-weight" type="checkbox" class="mt-0.5 rounded border-oat-300 accent-sage-600" />
              <span class="text-xs leading-relaxed">
                <span class="font-medium text-ink block">隱藏真實體重（隱私模式）</span>
                <span class="text-ink-400">遮蔽公斤數與精確 BMI，只顯示變化趨勢與達標進度</span>
              </span>
            </label>
            <div id="prof-pin-wrap" class="hidden space-y-2 pt-1 border-t border-oat-200/80">
              <div>
                <label id="prof-pin-label" for="prof-pin" class="text-xs text-ink-500">個人 4 位數密碼（選填）</label>
                <input id="prof-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="輸入 4 位數字" class="w-full border rounded-xl p-2 text-sm font-mono tracking-widest mt-1" />
              </div>
              <label id="prof-clear-pin-wrap" class="hidden flex items-center gap-2 text-xs text-ink-500 cursor-pointer select-none">
                <input id="prof-clear-pin" type="checkbox" class="rounded border-oat-300" />
                <span>清除現有密碼（改為無密碼點擊暫時檢視）</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 檢視模式操作列 -->
      <div id="prof-view-actions" class="flex gap-2 pt-1">
        <button type="button" class="btn-close-modal flex-1 py-2.5 bg-oat-100 text-ink-700 rounded-xl text-sm font-medium">關閉</button>
        <button type="button" id="btn-prof-edit" class="flex-1 py-2.5 bg-ink text-linen rounded-xl text-sm font-medium inline-flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.8 5.2a2.1 2.1 0 0 1 3 3L8.5 18.5 4.5 19.5l1-4 10.3-10.3Z" />
          </svg>
          <span>編輯資料</span>
        </button>
      </div>

      <!-- 編輯模式操作列 -->
      <div id="prof-edit-actions" class="hidden flex gap-2 pt-1">
        <button type="button" id="btn-prof-cancel-edit" class="flex-1 py-2.5 bg-oat-100 text-ink-700 rounded-xl text-sm font-medium">取消編輯</button>
        <button type="submit" class="flex-1 py-2.5 bg-sage-600 text-linen rounded-xl text-sm font-medium">儲存修改</button>
      </div>
    </form>
  </div>

  <!-- 彈窗：個人 4 位數 PIN 隱私解鎖 -->
  <div id="modal-pin" class="modal-overlay hidden fixed inset-0 bg-ink/45 backdrop-blur-[2px] z-[60] flex items-center justify-center p-4">
    <form id="form-pin" class="modal-sheet bg-linen border border-oat-200 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-soft">
      <div class="flex flex-col items-center text-center space-y-2">
        <div class="w-11 h-11 rounded-full bg-sage-50 border border-sage-200 text-sage-700 flex items-center justify-center" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2.5" />
            <path d="M8.5 11V8.2a3.5 3.5 0 0 1 7 0V11" />
          </svg>
        </div>
        <h3 id="pin-modal-title" class="font-semibold text-base text-ink">輸入個人密碼</h3>
        <p id="pin-modal-desc" class="text-xs text-ink-500 leading-relaxed">驗證後可暫時檢視真實體重，5 分鐘或離開畫面將自動重新隱藏。</p>
      </div>

      <div class="space-y-2">
        <input id="input-pin-verify" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" class="w-full border rounded-2xl py-3 px-4 text-center text-2xl tracking-[0.5em] font-mono" />
        <p id="pin-modal-error" class="hidden text-xs text-rosewood-600 text-center"></p>
      </div>

      <div class="flex gap-2">
        <button type="button" id="btn-pin-cancel" class="flex-1 py-2.5 bg-oat-100 text-ink-700 rounded-xl text-sm font-medium">取消</button>
        <button type="submit" id="btn-pin-submit" class="flex-1 py-2.5 bg-sage-600 text-linen rounded-xl text-sm font-medium">解鎖檢視</button>
      </div>
    </form>
  </div>
</body>
</html>
