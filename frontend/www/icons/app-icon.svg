<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9F7F2" />
      <stop offset="100%" stop-color="#EEEAE0" />
    </linearGradient>
    <filter id="card-shadow" x="-12%" y="-10%" width="124%" height="126%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2F342F" flood-opacity="0.09" />
    </filter>
  </defs>

  <!-- 溫潤棉紙基底 -->
  <rect width="512" height="512" fill="url(#paper-bg)" />

  <!-- 極簡圓角體重計外框 -->
  <rect x="92" y="92" width="328" height="328" rx="82" fill="#FCFBF8" stroke="#587864" stroke-width="11" filter="url(#card-shadow)" />

  <!-- 頂部弧形刻度窗 -->
  <path d="M174 176 A96 96 0 0 1 338 176 L316 206 A64 64 0 0 0 196 206 Z" fill="#EEF3EF" stroke="#587864" stroke-width="7.5" stroke-linejoin="round" />

  <!-- 細緻刻度線與暖陶土指針 -->
  <line x1="256" y1="142" x2="256" y2="158" stroke="#587864" stroke-width="6" stroke-linecap="round" />
  <line x1="215" y1="154" x2="223" y2="167" stroke="#8AA895" stroke-width="5.5" stroke-linecap="round" />
  <line x1="297" y1="154" x2="289" y2="167" stroke="#8AA895" stroke-width="5.5" stroke-linecap="round" />
  <line x1="256" y1="196" x2="274" y2="156" stroke="#C07A57" stroke-width="7" stroke-linecap="round" />
  <circle cx="256" cy="196" r="6.5" fill="#C07A57" />

  <!-- 中央鼠尾草嫩葉（象徵家人） -->
  <path d="M236 346 C236 310 238 278 248 250" fill="none" stroke="#456150" stroke-width="7.5" stroke-linecap="round" />
  <path d="M240 314 C194 312 168 286 172 246 C214 249 241 274 240 314 Z" fill="#6D8D79" stroke="#3B3A34" stroke-width="6" stroke-linejoin="round" />
  <path d="M236 309 L196 270" fill="none" stroke="#EEF3EF" stroke-width="4.5" stroke-linecap="round" />
  <path d="M244 282 C276 279 294 258 290 228 C258 232 242 252 244 282 Z" fill="#8EAD99" stroke="#3B3A34" stroke-width="6" stroke-linejoin="round" />

  <!-- 右下角暖陶土毛孩小掌印（象徵貓咪與狗狗） -->
  <g fill="#C07A57">
    <circle cx="305" cy="306" r="10.5" />
    <circle cx="330" cy="296" r="10.5" />
    <circle cx="352" cy="310" r="10" />
    <path d="M304 338 C304 323 317 314 331 314 C345 314 356 323 356 338 C356 348 348 355 339 355 C334 355 333 352 330 352 C327 352 325 355 320 355 C311 355 304 348 304 338 Z" />
  </g>
</svg>
